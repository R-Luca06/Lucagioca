name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Avant le build : c'est l'étape la plus rapide à échouer, et la plus
      # précise quand elle échoue.
      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Budget JS par page
        run: node scripts/check-budget.mjs

      - name: Installer les navigateurs Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests e2e
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
